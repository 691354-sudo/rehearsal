name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: rehearsal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 2

      - id: changes
        name: Detect application changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          deploy=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            deploy=true
          else
            while IFS= read -r file; do
              case "$file" in
                *.md) ;;
                *) deploy=true; break ;;
              esac
            done < <(git diff --name-only HEAD^ HEAD)
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Skip Markdown-only release
        if: steps.changes.outputs.deploy == 'false'
        run: echo "Markdown-only change; production already runs the same application code."

      - id: release
        name: Resolve exact release commit
        if: steps.changes.outputs.deploy == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify manual release passed CI
        if: steps.changes.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          successful_runs="$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$RELEASE_SHA" \
            --jq '.total_count')"
          if [[ "$successful_runs" -lt 1 ]]; then
            echo "Refusing deployment: exact main commit has no successful CI run" >&2
            exit 1
          fi

      - name: Configure SSH
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/rehearsal_deploy
          chmod 600 ~/.ssh/rehearsal_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package exact commit
        if: steps.changes.outputs.deploy == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: git archive --format=tar.gz --output="/tmp/rehearsal-${RELEASE_SHA}.tar.gz" "$RELEASE_SHA"

      - name: Install runtime secrets
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROMAN_PROFILE_PIN: ${{ secrets.ROMAN_PROFILE_PIN }}
          OLIVER_PROFILE_PIN: ${{ secrets.OLIVER_PROFILE_PIN }}
          ZANNA_PROFILE_PIN: ${{ secrets.ZANNA_PROFILE_PIN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_PROFILE_IDS: ${{ secrets.TELEGRAM_ALLOWED_PROFILE_IDS }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
        run: |
          umask 077
          secret_stage="/tmp/rehearsal-secrets-${GITHUB_RUN_ID}"
          install -d -m 700 "$secret_stage"
          printf '%s' "$ROMAN_PROFILE_PIN" > "$secret_stage/roman_profile_pin"
          printf '%s' "$OLIVER_PROFILE_PIN" > "$secret_stage/oliver_profile_pin"
          printf '%s' "$ZANNA_PROFILE_PIN" > "$secret_stage/zanna_profile_pin"
          printf '%s' "$SESSION_SECRET" > "$secret_stage/session_secret"
          printf '%s' "$TELEGRAM_BOT_TOKEN" > "$secret_stage/telegram_bot_token"
          printf '%s' "$TELEGRAM_ALLOWED_PROFILE_IDS" > "$secret_stage/telegram_allowed_profile_ids"
          printf '%s' "$TELEGRAM_ALLOWED_USER_IDS" > "$secret_stage/telegram_allowed_user_ids"
          remote_stage="/tmp/rehearsal-secrets-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/rehearsal_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 700 '$remote_stage' /opt/apps/rehearsal/secrets"
          scp -i ~/.ssh/rehearsal_deploy "$secret_stage"/* \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_stage}/"
          ssh -i ~/.ssh/rehearsal_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             install -m 600 '$remote_stage/roman_profile_pin' /opt/apps/rehearsal/secrets/roman_profile_pin
             install -m 600 '$remote_stage/oliver_profile_pin' /opt/apps/rehearsal/secrets/oliver_profile_pin
             install -m 600 '$remote_stage/zanna_profile_pin' /opt/apps/rehearsal/secrets/zanna_profile_pin
             install -m 600 '$remote_stage/session_secret' /opt/apps/rehearsal/secrets/session_secret
             install -m 600 '$remote_stage/telegram_bot_token' /opt/apps/rehearsal/secrets/telegram_bot_token
             install -m 600 '$remote_stage/telegram_allowed_profile_ids' /opt/apps/rehearsal/secrets/telegram_allowed_profile_ids
             install -m 600 '$remote_stage/telegram_allowed_user_ids' /opt/apps/rehearsal/secrets/telegram_allowed_user_ids
             rm -f '$remote_stage/roman_profile_pin' '$remote_stage/oliver_profile_pin' '$remote_stage/zanna_profile_pin' '$remote_stage/session_secret' '$remote_stage/telegram_bot_token' '$remote_stage/telegram_allowed_profile_ids' '$remote_stage/telegram_allowed_user_ids'
             rmdir '$remote_stage'"
          rm -f "$secret_stage/roman_profile_pin" "$secret_stage/oliver_profile_pin" "$secret_stage/zanna_profile_pin" "$secret_stage/session_secret" "$secret_stage/telegram_bot_token" "$secret_stage/telegram_allowed_profile_ids" "$secret_stage/telegram_allowed_user_ids"
          rmdir "$secret_stage"

      - name: Upload release
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          scp -i ~/.ssh/rehearsal_deploy \
            "/tmp/rehearsal-${RELEASE_SHA}.tar.gz" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/rehearsal-${RELEASE_SHA}.tar.gz"
          ssh -i ~/.ssh/rehearsal_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -d -m 755 '/opt/apps/rehearsal/releases/${RELEASE_SHA}' && tar -xzf '/tmp/rehearsal-${RELEASE_SHA}.tar.gz' -C '/opt/apps/rehearsal/releases/${RELEASE_SHA}' && rm '/tmp/rehearsal-${RELEASE_SHA}.tar.gz'"

      - name: Deploy and verify
        if: steps.changes.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          printf -v remote_command \
            "DEPLOY_SHA=%q PRODUCTION_URL=%q bash %q" \
            "$RELEASE_SHA" "$PRODUCTION_URL" "/opt/apps/rehearsal/releases/${RELEASE_SHA}/scripts/deploy-release.sh"
          ssh -i ~/.ssh/rehearsal_deploy "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "$remote_command"
